# SPA de Vite detrás de los gateways de GKE. Puerto 8080 fijo: el que declaran el
# Service, los probes y el HealthCheckPolicy del overlay en gitops/fluxcd.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Assets con hash de Vite en el nombre: cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca cacheado: toma los hashes nuevos tras cada deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback de SPA: las rutas del router caen a index.html.
    location / {
        try_files $uri /index.html;
    }
}
